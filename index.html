<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Esta es la línea mágica que hace la redirección en 4 segundos -->
    <meta http-equiv="refresh" content="4;url=https://efdh-sedif.pages.dev/">
    <title>Actualización de Portal - SEDIF</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8faff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #2c3e50; }
        .aviso-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(123, 123, 181, 0.15); max-width: 500px; text-align: center; border-top: 8px solid #7b7bb5; }
        h2 { color: #7b7bb5; margin-top: 0; }
        .spinner { margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #00ad9f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #00ad9f; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="aviso-box">
        <h2>¡Portal Actualizado! 🚀</h2>
        <p>El sistema de inscripciones de la <strong>Escuela de Formación y Desarrollo Humano</strong> se ha movido a una nueva plataforma institucional más segura.</p>
        <div class="spinner"></div>
        <p>Serás redirigido automáticamente en unos segundos...</p>
        <p style="font-size: 0.9em; color: #666;">Si no te redirige, <a href="https://efdh-sedif.pages.dev/">haz clic aquí para ir al nuevo portal</a>.</p>
    </div>
</body>
</html>
